<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Ambient Audio Wave</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: transparent; /* Ensures OBS transparency works */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Safe Fallback: Create a procedural rhythmic audio wave 
        // This runs instantly in OBS without needing mic or permission access
        let phase = 0;
        
        function drawProceduralWave() {
            requestAnimationFrame(drawProceduralWave);
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            ctx.clearRect(0, 0, width, height);

            const numBars = 32;
            const barWidth = (width / numBars) * 1.5;
            let x = 0;

            phase += 0.04; // Controls the speed of the wave rhythm

            for (let i = 0; i < numBars; i++) {
                // Creates a natural bouncing audio wave calculation
                let factor = Math.sin(i * 0.3 + phase) * Math.cos(i * 0.1 - phase * 0.5);
                let barHeight = Math.abs(factor) * (height * 0.4) + 10; 

                // Styling Neon Cyan/Blue Gradient
                ctx.fillStyle = `hsl(${(i / numBars) * 60 + 190}, 100%, 50%)`;

                // Center the bars vertically
                const y = (height - barHeight) / 2;
                
                // Draw sleek rounded bars
                drawRoundedRect(ctx, x, y, barWidth - 4, barHeight, 5);
                x += barWidth;
            }
        }

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            if (height < radius) return;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // Kick off loop immediately 
        drawProceduralWave();
    </script>
</body>
</html>
