<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Vertical Audio Wave</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: transparent; /* Clear background for OBS */
            display: flex;
            align-items: flex-end; /* Aligns canvas container to the bottom */
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        let phase = 0;
        
        function drawVerticalWave() {
            requestAnimationFrame(drawVerticalWave);
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            ctx.clearRect(0, 0, width, height);

            // Increased number of bars for a denser, smoother visual wave look
            const numBars = 64; 
            const barWidth = width / numBars;
            let x = 0;

            phase += 0.05; // Wave animation speed

            for (let i = 0; i < numBars; i++) {
                // Procedural wave algorithm simulating rising music beats
                let wave1 = Math.sin(i * 0.15 + phase * 1.2);
                let wave2 = Math.cos(i * 0.08 - phase * 0.6);
                let combinedFactor = Math.abs(wave1 * wave2);
                
                // Scale height so it stays in the lower/middle half of your stream window
                let barHeight = combinedFactor * (height * 0.6) + 15; 

                // Sleek Purple-to-Cyan gradient calculation based on bar position
                ctx.fillStyle = `hsl(${(i / numBars) * 100 + 240}, 100%, 60%)`;

                // Calculate Y position to start exactly from the bottom floor of the canvas
                const y = height - barHeight;
                
                // Draw vertical bars with a tiny 2px gap between them
                drawTopRoundedRect(ctx, x, y, barWidth - 2, barHeight, 6);
                x += barWidth;
            }
        }

        // Custom drawing function to only round the TOP corners of the bars
        function drawTopRoundedRect(ctx, x, y, width, height, radius) {
            if (height < radius) radius = height;
            ctx.beginPath();
            ctx.moveTo(x, y + height); // Bottom-left corner
            ctx.lineTo(x, y + radius); // Up to top-left start
            ctx.quadraticCurveTo(x, y, x + radius, y); // Top-left curve
            ctx.lineTo(x + width - radius, y); // Across to top-right start
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius); // Top-right curve
            ctx.lineTo(x + width, y + height); // Down to bottom-right corner
            ctx.closePath(); // Closes bottom flat line automatically
            ctx.fill();
        }

        // Start the infinite animation loop
        drawVerticalWave();
    </script>
</body>
</html>
